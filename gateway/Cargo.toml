[package]
name = "trade-gateway"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
description = "Trade gateway: market-data providers, bar cache, REST + WS API, SQLite, engine supervisor"
publish = false

[lib]
name = "trade_gateway"
path = "src/lib.rs"

[[bin]]
name = "trade-gateway"
path = "src/main.rs"

[dependencies]
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "net"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }

# Enforced by `cargo clippy --all-targets -- -D warnings` (make check).
[lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[lints.clippy]
expect_used = "deny"
unwrap_used = "deny"
